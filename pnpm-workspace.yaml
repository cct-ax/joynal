allowBuilds:
  '@parcel/watcher': true
  # @nuxt/content の dev 用ローカル SQLite。docs サイトは dev 限定のため本番(worker)には含めない。
  better-sqlite3: true
  esbuild: true
  # @unovis/ts の地図コンポーネント用 transitive 依存。日報の mood 推移グラフでは地図を使わないためビルド不要。
  maplibre-gl: false
  sharp: true
  unrs-resolver: true
  vue-demi: true
  workerd: true
# 修正版が無い／上げると壊れる dev・build 専用経路のアドバイザリを pnpm audit から除外する。
# いずれも Cloudflare の本番成果物には含まれない。解消条件を満たしたら該当行を削除すること。
auditConfig:
  ignoreGhsas:
    # simple-git（@nuxt/devtools 経由・dev のみ）。修正は simple-git 4 だが default export 廃止で
    # devtools 3.x が読み込み失敗する。devtools 4 安定版（simple-git 依存なし）へ上げたら削除。
    - GHSA-x6jw-m9v5-85vh # critical: trailer 設定経由のコマンド実行
    - GHSA-v5rq-49vh-5v5c # critical: @simple-git/argv-parser の VISUAL 検出漏れ
    - GHSA-g4wm-2vf7-vfgr # high: Git config include 経由のコマンド実行
    - GHSA-858h-whjf-mvg5 # high: long-option 省略形による unsafe-operations バイパス
    # 修正版が未公開（first_patched_version なし）。nitropack 経由の dev/build 時専用。修正版公開で削除。
    - GHSA-86w9-cpqp-85rv # high: node-forge RSA 署名検証（listhen の dev 証明書生成）
    - GHSA-vfj7-8cjw-p6xm # high: braces のスタック枯渇 DoS（globby によるビルド時 glob）
overrides:
  cac: "^6.7.14"
  commander: "^13.1.0"
  # devalue <5.8.1 は GHSA-77vg-94rm-hx3p（sparse array deserialization の DoS, high）。
  # nuxt/nitro 経由の推移的依存。patched 版へ底上げして pnpm audit --audit-level=high を green に保つ。
  devalue: "^5.8.1"
  # shell-quote <=1.8.3 は GHSA-w7jw-789q-3m8p（critical）、<=1.8.4 は GHSA-395f-4hp3-45gv（二次計算量 DoS, high）。launch-editor が推移的に引く。
  shell-quote: "^1.8.5"
  # esbuild <0.28.1 は GHSA-gv7w-rqvm-qjhr（low）。Vite/fontless が推移的に引く。
  esbuild: "^0.28.1"
  # ws <8.21.0 は GHSA-96hv-2xvq-fx4p（high）。Supabase realtime が推移的に引く。
  ws: "^8.21.0"
  # vite <=7.3.4 / 8.0.0〜8.0.15 は GHSA-fx2h-pf6j-xcff（high）。Nuxt UI/dev tooling が推移的に引く。
  # nuxt 4.6 の @nuxt/vite-builder は vite ^8.3.2 必須（7 系だと transformWithOxc が無くビルド不能）。
  vite: "^8.3.2"
  # undici <7.28.0 は GHSA-vmh5-mc38-953g / GHSA-vxpw-j846-p89q / GHSA-hm92-r4w5-c3mj（high）。Wrangler/miniflare が推移的に引く。
  undici: "^7.28.0"
  # tar <=7.5.15 は PAX size override による parser interpretation differential（medium）、
  # <=7.5.17 は GHSA-8x88-c5mf-7j5w（負の entry size による無限ループ, high）、
  # <=7.5.18 は GHSA-23hp-3jrh-7fpw（解凍/パースの DoS, critical）。@vercel/nft 経由の推移的依存。
  tar: "^7.5.19"
  # launch-editor <=2.14.0 は GHSA（Windows UNC パス経由の NTLMv2 hash 漏えい, medium）。Vite 経由の推移的依存。
  launch-editor: "^2.14.1"
  # brace-expansion <5.0.6 は GHSA-v6h2-p8h4-qcjw（ReDoS, medium）、<5.0.7 は GHSA-3jxr-9vmj-r5cp（{} 連続グループの指数時間展開 DoS, high）。推移的依存。
  brace-expansion: "^5.0.7"
  # js-yaml <=4.1.1 は GHSA-h67p-54hq-rp68（merge key の二次計算量 DoS, moderate）、<4.3.0 は GHSA-52cp-r559-cp3m（merge-key チェーンの二次計算量 CPU, high）。eslint-typegen 経由の推移的依存。
  js-yaml: "^4.3.0"
  # @babel/core <=7.29.0 は GHSA-4x5r-pxfx-6jf8（sourceMappingURL 経由の任意ファイル読み取り, low）。nitro/vite builder 経由の推移的依存。
  "@babel/core": "^7.29.1"
  # svgo >=4.0.0 <4.0.2 は GHSA-2p49-hgcm-8545（removeScripts plugin が実行可能要素を残す, high）。推移的依存。
  svgo: "^4.0.2"
  # sharp <0.35.0 は GHSA-f88m-g3jw-g9cj（libvips 由来の脆弱性の継承, high）。推移的依存。
  sharp: "^0.35.0"
